name: Welcome first time contributors

on:
  pull_request_target:
    types:
      - opened
  issues:
    types:
      - opened
permissions:
  issues: write
  pull-requests: write
jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # https://github.com/actions/first-interaction/releases/tag/v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Hi ${{ github.actor }}! 👋

            Thanks for the report. A maintainer will triage it; until then there is nothing to do on your side.

            Want to fix it yourself? Ask to be assigned here first and read [Contributing](https://github.com/kafbat/kafka-ui/blob/main/.github/CONTRIBUTING.md). PRs for unassigned issues wait.

            We work on this in our spare time. [Sponsoring](https://github.com/kafbat) helps.

          pr-message: |
            Hi ${{ github.actor }}! 👋

            Thanks for your first PR here. Before a maintainer looks at it, two things from [Contributing](https://github.com/kafbat/kafka-ui/blob/main/.github/CONTRIBUTING.md):

            - The linked issue must be assigned to you. No assignee means it is not triaged yet, and the PR waits.
            - If a tool wrote this and you could not have written it yourself, close the PR now. It saves everyone a review.

            We do this in our spare time. Reviews take days; pings do not make them faster. [Sponsoring](https://github.com/kafbat) helps.
