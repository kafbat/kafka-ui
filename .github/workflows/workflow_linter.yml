name: "Infra: Workflow linter"
on:
  pull_request:
    types: ["opened", "reopened", "synchronize"]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4.0.0
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install yamllint
        run: sudo apt install -y yamllint

      - name: Validate workflow yaml files
        run: yamllint .github/workflows/. -d relaxed -f github --no-warnings

      - name: Install actions-lock extension
        run: gh extension install github/gh-actions-lock --pin 04b7a1a4d00b339dd3ff903bb4d78d4066b2bac7

      - name: Verify workflow lockfile
        run: gh actions-lock --verify
