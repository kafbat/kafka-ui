name: Temporary full test verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-full-check.yml'

permissions:
  contents: read

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version-file: .java-version
          cache: gradle
      - name: Run all Gradle checks (including API tests)
        run: ./gradlew check :api:check
