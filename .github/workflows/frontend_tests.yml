name: "Frontend: build and test"

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    env:
      CI: true
      NODE_ENV: dev
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4.0.0

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.26.1

      - name: Install node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: "22.12.0"
          cache: "pnpm"
          cache-dependency-path: "./frontend/pnpm-lock.yaml"

      - name: Install Node dependencies
        run: |
          cd frontend/
          pnpm install --frozen-lockfile

      - name: Linter
        run: |
          cd frontend/
          pnpm lint:CI

  tests:
    env:
      CI: true
      NODE_ENV: dev
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.26.1

      - name: Install node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: "22.12.0"
          cache: "pnpm"
          cache-dependency-path: "./frontend/pnpm-lock.yaml"

      - name: Install Node dependencies
        run: |
          cd frontend/
          pnpm install --frozen-lockfile

      - name: Compile
        run: |
          cd frontend/
          pnpm compile

      - name: Tests
        run: |
          cd frontend/
          pnpm test:CI

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v5.4.3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  audit:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4.0.0

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.26.1

      - name: Install node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: "22.12.0"
          cache: "pnpm"
          cache-dependency-path: "./frontend/pnpm-lock.yaml"

      - name: Install Node dependencies
        run: |
          cd frontend/
          pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: |
          cd frontend/
          pnpm audit --prod --audit-level=high
