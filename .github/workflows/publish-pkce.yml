name: Publish PKCE image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pkce-image-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version-file: .java-version
          cache: gradle
      - name: Determine upstream image version
        id: version
        env:
          IMAGE_VERSION: ${{ vars.KAFBAT_IMAGE_VERSION }}
        run: |
          VERSION="${IMAGE_VERSION:-1.5.0}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid image version: $VERSION" >&2
            exit 1
          fi
          echo "tag=${VERSION}-pkce" >> "$GITHUB_OUTPUT"
      - name: Verify integrated PKCE
        run: ./gradlew :api:check :api:bootJar -Pinclude-frontend=true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned PKCE image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker build -f api/Dockerfile --build-arg JAR_FILE="$(find api/build/libs -maxdepth 1 -name 'api-*.jar' ! -name '*-plain.jar' -printf 'build/libs/%f\n' | head -n 1)" -t "ghcr.io/diemar-consulting/kafka-ui:$TAG" api
          docker push "ghcr.io/diemar-consulting/kafka-ui:$TAG"
