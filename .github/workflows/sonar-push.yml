name: "SonarCloud: Push analysis"

on:
  push:
    branches: [ "main" ]
    paths:
      - "api/**"
      - "serde-api/**"
      - "contract/**"
      - "contract-typespec/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/sonar-push.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version-file: .java-version
          cache: gradle
      - name: Verify and analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Repository secret SONAR_TOKEN is required for SonarCloud analysis of kafbat_kafka-ui."
            exit 1
          fi
          ./gradlew check :api:check sonar -Dsonar.qualitygate.wait=true
