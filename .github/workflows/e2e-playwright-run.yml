name: "E2E: Playwright"

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          token: ${{ github.token }}
          ref: ${{ inputs.sha }}

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # https://github.com/actions/setup-java/releases/tag/v6.3.0
        with:
          java-version-file: '.java-version'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          ./gradlew build -x test \
          -Pbuild-docker-images=true \
          -Pinclude-frontend=true \
          -Pversion=latest

      - name: Dump docker image
        run: docker image save ghcr.io/kafbat/kafka-ui:latest > /tmp/kafka-ui-e2e-image.tar

      - name: Upload docker image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: kafka-ui-e2e-image
          path: /tmp/kafka-ui-e2e-image.tar
          retention-days: 1

  tests:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          token: ${{ github.token }}
          ref: ${{ inputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: "22.12.0"
          cache-dependency-path: ./e2e-playwright/package-lock.json
          cache: 'npm'

      - name: Install NPM dependencies
        working-directory: ./e2e-playwright
        run: npm install

      - name: Cache Playwright browser binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # https://github.com/actions/cache/releases/tag/v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('./e2e-playwright/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: ./e2e-playwright
        run: npx playwright install --with-deps chromium

      - name: Download docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: kafka-ui-e2e-image
          path: /tmp

      - name: Load docker image
        run: docker image load -i /tmp/kafka-ui-e2e-image.tar

      - name: Run docker-compose
        run: docker compose -f ./documentation/compose/e2e-tests.yaml up -d

      - name: Run tests with ENV=prod
        working-directory: ./e2e-playwright
        run: ENV=prod npm run test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: playwright-results
          path: ./e2e-playwright/test-results/
          retention-days: 7
