name: "E2E: Playwright"

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ github.token }}
          ref: ${{ inputs.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v4.7.0
        with:
          java-version-file: ".java-version"
          distribution: "zulu"
          cache: "gradle"

      - name: Build with Gradle
        run: |
          ./gradlew build -x test \
          -Pbuild-docker-images=true \
          -Pinclude-frontend=true \
          -Pversion=latest

      - name: Dump docker image
        run: docker image save ghcr.io/kafbat/kafka-ui:latest > /tmp/kafka-ui-e2e-image.tar

      - name: Upload docker image
        uses: actions/upload-artifact@v4.6.0
        with:
          name: kafka-ui-e2e-image
          path: /tmp/kafka-ui-e2e-image.tar
          retention-days: 1

  tests:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ github.token }}
          ref: ${{ inputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "22.23.5"
          cache-dependency-path: ./e2e-playwright/pnpm-lock.yaml
          cache: "pnpm"

      - name: Install dependencies
        working-directory: ./e2e-playwright
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('./e2e-playwright/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: ./e2e-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Download docker image
        uses: actions/download-artifact@v4.1.8
        with:
          name: kafka-ui-e2e-image
          path: /tmp

      - name: Load docker image
        run: docker image load -i /tmp/kafka-ui-e2e-image.tar

      - name: Run docker-compose
        run: docker compose -f ./documentation/compose/e2e-tests.yaml up -d

      - name: Run tests with ENV=prod
        working-directory: ./e2e-playwright
        run: ENV=prod pnpm test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: playwright-results
          path: ./e2e-playwright/test-results/
          retention-days: 7
