name: "E2E: Playwright"

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # https://github.com/actions/checkout/releases/tag/v4.2.2
        with:
          token: ${{ github.token }}
          ref: ${{ inputs.sha }}

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # https://github.com/actions/setup-java/releases/tag/v4
        with:
          java-version-file: '.java-version'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          ./gradlew build -x test \
          -Pbuild-docker-images=true \
          -Pinclude-frontend=true \
          -Pversion=latest

      - name: Dump docker image
        run: docker image save ghcr.io/kafbat/kafka-ui:latest > /tmp/kafka-ui-e2e-image.tar

      - name: Upload docker image
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # https://github.com/actions/upload-artifact/releases/tag/v4
        with:
          name: kafka-ui-e2e-image
          path: /tmp/kafka-ui-e2e-image.tar
          retention-days: 1

  tests:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # https://github.com/actions/checkout/releases/tag/v4.2.2
        with:
          token: ${{ github.token }}
          ref: ${{ inputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # https://github.com/actions/setup-node/releases/tag/v4.2.0
        with:
          node-version: 18
          cache-dependency-path: ./e2e-playwright/package-lock.json
          cache: 'npm'

      - name: Install NPM dependencies
        working-directory: ./e2e-playwright
        run: npm install

      - name: Cache Playwright browser binaries
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # https://github.com/actions/cache/releases/tag/v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('./e2e-playwright/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: ./e2e-playwright
        run: npx playwright install --with-deps chromium

      - name: Download docker image
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # https://github.com/actions/download-artifact/releases/tag/v4
        with:
          name: kafka-ui-e2e-image
          path: /tmp

      - name: Load docker image
        run: docker image load -i /tmp/kafka-ui-e2e-image.tar

      - name: Run docker-compose
        run: docker compose -f ./documentation/compose/e2e-tests.yaml up -d

      - name: Run tests with ENV=prod
        working-directory: ./e2e-playwright
        run: ENV=prod npm run test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # https://github.com/actions/upload-artifact/releases/tag/v4
        with:
          name: playwright-results
          path: ./e2e-playwright/test-results/
          retention-days: 7
