name: "Infra: CVE checks"
on:
  pull_request:
    types: [ "opened", "reopened", "synchronize" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: '0 8 15 * *'

permissions:
  contents: read

jobs:

  check-frontend-cves:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.0.0
        with:
          token: ${{ github.token }}

      - name: Run frontend dependency CVE checks
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "frontend"
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "1"

  check-docker-cves:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.0.0
        with:
          token: ${{ github.token }}

      - name: Set up JDK
        uses: actions/setup-java@v4.7.0
        with:
          java-version-file: '.java-version'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build project
        id: build
        run: |
          ./gradlew clean build \
          -x test \
          -Pbuild-docker-images=true \
          -Pinclude-frontend=true \
          -Pversion=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build docker image
        uses: docker/build-push-action@v6.15.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: api
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ghcr.io/kafbat/kafka-ui:latest
          build-args: |
            JAR_FILE=build/libs/api-latest.jar

      - name: Run Docker image CVE checks
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "ghcr.io/kafbat/kafka-ui:latest"
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "1"

  notify:
    needs: [ check-frontend-cves, check-docker-cves ]
    if: ${{ always() && (needs.check-frontend-cves.result == 'failure' || needs.check-docker-cves.result == 'failure') && github.event_name == 'schedule' }}
    uses: ./.github/workflows/infra_discord_hook.yml
    with:
      message: "Attention! CVE checks run failed! Please fix them CVEs :("
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CVE }}
